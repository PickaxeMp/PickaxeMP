[package]
name = "pickaxe-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "PickaxeMP NetherNet transport sidecar"
license = "Apache-2.0"

[[bin]]
name = "pickaxe-transport"
path = "src/main.rs"

[lib]
name = "pickaxe_transport"
path = "src/lib.rs"

[dependencies]
# Pinned to a fixed revision — never track a branch.
nethernet-tokio = { git = "https://github.com/bedrock-crustaceans/nethernet.git", rev = "ed552b0b60dc6f8d54e0d7d42a9c66a9b9bdfb99" }
# Direct dependency for `HttpSignalerConfig` (same pinned revision, so the
# transitive and direct copies resolve to one crate).
nethernet = { git = "https://github.com/bedrock-crustaceans/nethernet.git", rev = "ed552b0b60dc6f8d54e0d7d42a9c66a9b9bdfb99" }
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
bytes = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
