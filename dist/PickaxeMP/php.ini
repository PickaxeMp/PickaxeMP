; PickaxeMP — proje düzeyi PHP yapılandırması
;
; Bu dosya SADECE bu proje için kullanılır. Sistem genelindeki php.ini
; dosyasına DOKUNULMAZ.
;
; Kullanım:
;   Windows : tools\php.cmd script.php
;   Linux   : tools/php.sh script.php
;
; extension_dir=ext göreli yoldur ve php.exe'nin yanındaki ext/ klasörünü
; çözer. Böylece makineye özgü mutlak yol saklamayız.

extension_dir = "ext"

; Phase 0 için zorunlu
extension=openssl
extension=mbstring
extension=fileinfo
extension=curl
extension=zip

; Geliştirme kolaylıkları
error_reporting = E_ALL
display_errors = On
log_errors = Off

; Uzun süre çalışan sunucu süreci için
memory_limit = 512M
max_execution_time = 0

; Zaman dilimi sabit — log tutarlılığı için
date.timezone = UTC

; Test ve CI çıktısı için
output_buffering = Off
